name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Build
        run: ./gradlew build -Pcommit="$GITHUB_SHA" -Pbuild_number="$GITHUB_RUN_NUMBER"

      - name: Prepare artifacts
        id: artifacts
        shell: bash
        run: |
          jar_path="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          if [[ -z "$jar_path" ]]; then
            echo "No distributable jar found in build/libs" >&2
            exit 1
          fi

          mkdir -p work_files/release
          cp "$jar_path" work_files/release/meteor-evfork-latest.jar
          (cd work_files/release && sha256sum meteor-evfork-latest.jar > meteor-evfork-latest.jar.sha256)
          echo "jar_path=$jar_path" >> "$GITHUB_OUTPUT"

      - name: Upload commit artifact
        uses: actions/upload-artifact@v7
        with:
          name: meteor-evfork-${{ github.sha }}
          path: ${{ steps.artifacts.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Update latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Automated build from commit \`${GITHUB_SHA}\` on branch \`${GITHUB_REF_NAME}\`."

          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" \
              -F force=true
            gh release edit latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest Meteor EvFork build" \
              --notes "$notes" \
              --prerelease
            gh release upload latest work_files/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create latest work_files/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Latest Meteor EvFork build" \
              --notes "$notes" \
              --prerelease
          fi
